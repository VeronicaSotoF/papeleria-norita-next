<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Logo Papelería Norita" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo -->
  <rect x="2" y="2" width="92" height="92" rx="22" fill="#245a75"/>

  <!-- Cuaderno -->
  <rect x="26" y="18" width="46" height="58" rx="6" fill="#ffffff"/>

  <!-- Renglones -->
  <g stroke="#c9d6dd" stroke-width="3" stroke-linecap="round">
    <line x1="40" y1="34" x2="62" y2="34"/>
    <line x1="40" y1="45" x2="62" y2="45"/>
    <line x1="40" y1="56" x2="54" y2="56"/>
  </g>

  <!-- Espiral del cuaderno -->
  <g fill="#f2c94c" stroke="#245a75" stroke-width="2">
    <rect x="19" y="28" width="16" height="6" rx="3"/>
    <rect x="19" y="42" width="16" height="6" rx="3"/>
    <rect x="19" y="56" width="16" height="6" rx="3"/>
  </g>

  <!-- Lápiz -->
  <g transform="translate(66 60) rotate(45)" stroke="#245a75" stroke-width="2.5" stroke-linejoin="round">
    <rect x="-5.5" y="-27" width="11" height="6" rx="2" fill="#ffffff"/>
    <rect x="-5.5" y="-21" width="11" height="33" fill="#f2c94c"/>
    <polygon points="-5.5,12 5.5,12 0,25" fill="#f7e2a0"/>
    <polygon points="-1.8,20.5 1.8,20.5 0,25" fill="#202124" stroke="none"/>
  </g>
</svg>
